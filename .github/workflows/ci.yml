name: Omni Ticket CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend PWA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python for browser tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Test frontend components
        run: npm test

      - name: Install isolated browser-test backend
        run: |
          python -m venv ../backend/.venv
          ../backend/.venv/bin/python -m pip install --upgrade pip
          ../backend/.venv/bin/python -m pip install -e "../backend[dev]"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test desktop, tablet, mobile, and accessibility workflows
        env:
          OMNI_DATABASE_URL: sqlite:////tmp/omni-ticket-e2e.db
          OMNI_ENVIRONMENT: local
        run: npm run test:e2e

      - name: Upload browser-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omni-browser-test-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

  backend:
    name: Python Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile backend
        run: python -m compileall app tests migrations

      - name: Lint backend
        run: ruff check app tests migrations

      - name: Typecheck backend
        run: mypy app tests

      - name: Test backend
        run: pytest -q

      - name: Verify migrations
        env:
          OMNI_DATABASE_URL: sqlite:////tmp/omni-ticket-ci-migrations.db
        run: alembic upgrade head

      - name: Smoke worker cycle
        env:
          OMNI_DATABASE_URL: sqlite:////tmp/omni-ticket-ci-worker.db
        run: python -m app.worker --once --market-id market-ng
