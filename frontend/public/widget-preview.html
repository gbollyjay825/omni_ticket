<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omni Messenger Preview</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: #172b3a;
        background: #f4f7f9;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 64px;
        padding: 0 28px;
        background: #fff;
        border-bottom: 1px solid #d8e3ea;
      }
      header strong { font-size: 15px; }
      header span { color: #667a89; font-size: 12px; }
      main {
        width: min(920px, calc(100% - 32px));
        margin: 60px auto;
        padding: 32px;
        background: #fff;
        border: 1px solid #d8e3ea;
        border-radius: 8px;
      }
      h1 { margin: 0 0 10px; font-size: 26px; letter-spacing: 0; }
      p { max-width: 620px; margin: 0; color: #607483; line-height: 1.6; }
      .booking-row {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1px;
        margin-top: 28px;
        overflow: hidden;
        background: #d8e3ea;
        border: 1px solid #d8e3ea;
        border-radius: 6px;
      }
      .booking-row div { padding: 18px; background: #f8fafb; }
      .booking-row small { display: block; margin-bottom: 5px; color: #718492; }
      @media (max-width: 600px) {
        header { padding: 0 16px; }
        main { margin: 24px auto; padding: 20px; }
        .booking-row { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Wakanow booking</strong>
      <span>Messenger host-page preview</span>
    </header>
    <main>
      <h1>Your trip to Accra</h1>
      <p>This page verifies how the Omni messenger behaves when embedded into a customer journey.</p>
      <div class="booking-row">
        <div><small>Reference</small><strong>WK-PREVIEW-100</strong></div>
        <div><small>Departure</small><strong>Lagos</strong></div>
        <div><small>Arrival</small><strong>Accra</strong></div>
      </div>
    </main>
    <script
      type="module"
      src="/omni-widget.js"
      data-market="ng"
      data-api-url="http://127.0.0.1:8000"
    ></script>
  </body>
</html>
