services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PULSE_POSTGRES_DB:-omni_ticket}
      POSTGRES_USER: ${PULSE_POSTGRES_USER:-omni}
      POSTGRES_PASSWORD: ${PULSE_POSTGRES_PASSWORD:-omni-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PULSE_POSTGRES_USER:-omni} -d ${PULSE_POSTGRES_DB:-omni_ticket}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pulse-postgres:/var/lib/postgresql/data

  migrate:
    build:
      context: ./services/omni-ticket-backend
    command: alembic upgrade head
    env_file:
      - ${PULSE_ENV_FILE:-.env.pulse}
    environment:
      OMNI_DATABASE_URL: postgresql+psycopg://${PULSE_POSTGRES_USER:-omni}:${PULSE_POSTGRES_PASSWORD:-omni-change-me}@postgres:5432/${PULSE_POSTGRES_DB:-omni_ticket}
      OMNI_INITIALIZE_DATABASE: "false"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./services/omni-ticket-backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - ${PULSE_ENV_FILE:-.env.pulse}
    environment:
      OMNI_DATABASE_URL: postgresql+psycopg://${PULSE_POSTGRES_USER:-omni}:${PULSE_POSTGRES_PASSWORD:-omni-change-me}@postgres:5432/${PULSE_POSTGRES_DB:-omni_ticket}
    volumes:
      - pulse-attachments:/var/lib/omni-ticket/attachments
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ./services/omni-ticket-backend
    restart: unless-stopped
    command: python -m app.worker --interval-seconds ${OMNI_WORKER_INTERVAL_SECONDS:-60} --outbound-limit ${OMNI_WORKER_OUTBOUND_LIMIT:-50}
    env_file:
      - ${PULSE_ENV_FILE:-.env.pulse}
    environment:
      OMNI_DATABASE_URL: postgresql+psycopg://${PULSE_POSTGRES_USER:-omni}:${PULSE_POSTGRES_PASSWORD:-omni-change-me}@postgres:5432/${PULSE_POSTGRES_DB:-omni_ticket}
    volumes:
      - pulse-attachments:/var/lib/omni-ticket/attachments
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      args:
        VITE_OMNI_API_BASE_URL: ${PULSE_PUBLIC_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    ports:
      - "${PULSE_HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_started

volumes:
  pulse-postgres:
  pulse-attachments:
